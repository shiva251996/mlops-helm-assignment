name: Helm Chart CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint charts/ml-api

  validate:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Validate ${{ matrix.environment }} environment
        run: |
          helm template test charts/ml-api \
            -f charts/ml-api/values-${{ matrix.environment }}.yaml

  package-and-publish:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Package Helm chart
        run: |
          helm package charts/ml-api --destination .
          ls -la *.tgz

      # Mocked publish step
      - name: Upload chart as artifact (simulating publish to private registry)
        uses: actions/upload-artifact@v4
        with:
          name: ml-api-helm-chart
          path: "*.tgz"
          retention-days: 7